<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintage Story · Brankes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff5a36%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="topbar">
  <div class="wrap">
    <a class="back-link" href="index.html">← Brankes</a>

</div>

<section class="wrap" style="padding-top: 20px;">

  <div class="banner">
    <div class="banner-inner">
      <h1>Vintage Story</h1>
      <div class="status-line">
        <span class="status-dot" data-status-dot></span>
        <span data-status-label>Vérification…</span>
      </div>
    </div>
  </div>

  <div class="wake-block">
    <button class="btn-wake" data-action-btn disabled>Vérification…</button>
    <span class="wake-note" data-action-note></span>
    <button class="poweroff-link" data-poweroff-btn hidden>Éteindre la machine</button>
  </div>

  <div class="connect-row">
    <span class="addr" data-copy-value>brankes.duckdns.org:42420</span>
    <button class="copy-btn" data-copy-btn>Copier</button>
  </div>

  <div class="mods-section">
    <h2>On joue avec</h2>
    <div class="tag-cloud">
      <span class="tag">Carry On</span>
      <span class="tag">Player Corpse</span>
      <span class="tag">VSEssentials</span>
      <span class="tag">BetterEr Prospecting</span>
      <span class="tag">Primitive Survival</span>
      <span class="tag">Real Grapes</span>
      <span class="tag">Better Ruins</span>
      <span class="tag">Butchering</span>
      <span class="tag">Fantasy Creatures Reborn</span>

  </div>

    <button class="link-toggle" data-console-toggle>Afficher la console</button>
    <pre class="console-box" data-console-box hidden></pre>
  </div>

</section>

<footer>
  <div class="wrap"><a class="back-link" href="index.html">← Retour</a></div>
</footer>
